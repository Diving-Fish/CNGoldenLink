name: Build and release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.dependencies.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tagged commit belongs to main
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Only commits on main can be released' }
          if ($env:REF_TYPE -eq 'tag') {
            python scripts/prepare-ci.py --check-only --tag $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'Tag/version mismatch' }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download configured dependencies
        id: dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-ci.py
      - name: Test
        shell: pwsh
        run: |
          dotnet run --project tests/Diagnostics.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics tests failed' }
          dotnet run --project sync-tests/Sync.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Sync tests failed' }
      - name: Build release package
        shell: pwsh
        run: |
          $refs = Join-Path $PWD 'artifacts/ci/references'
          ./scripts/package.ps1 -CelestePath $refs -CctAssemblyPath (Join-Path $refs 'ConsistencyTracker.dll')
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/CNGoldenLink-${{ steps.dependencies.outputs.version }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-manifest
          path: artifacts/ci/dependencies.json

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          package="release/CNGoldenLink-${RELEASE_VERSION}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published files.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$package" --verify-tag --title "CNGoldenLink $RELEASE_VERSION" --generate-notes
